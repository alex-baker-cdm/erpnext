# This workflow is agnostic to branches. Only maintain on develop branch.
# To add/remove branches just modify the matrix.

name: Regenerate POT file (translatable strings)
on:
  schedule:
    # 9:30 UTC => 3 PM IST Sunday
    - cron: "30 9 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate-pot-file:
    name: Regenerate POT file
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ["develop", "version-16-hotfix"]
    permissions:
      contents: read

    steps:
        - name: Checkout
          uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
          with:
            ref: ${{ matrix.branch }}

        - name: Setup Python
          uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
          with:
            python-version: "3.14"

        - name: Setup Node
          uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
          with:
            node-version: 24

        - name: Run script to update POT file
          run: |
            bash ${GITHUB_WORKSPACE}/.github/helper/update_pot_file.sh
          env:
            GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
            BASE_BRANCH: ${{ matrix.branch }}
            PR_REVIEWER: barredterra # change to your GitHub username if you copied this file
