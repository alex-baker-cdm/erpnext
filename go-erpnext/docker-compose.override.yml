# Reference: How to add the Go service to ERPNext's Docker Compose
# Copy this file to your frappe_docker directory, then adjust the context
# path below to point to the go-erpnext directory relative to frappe_docker.
# Example:
#   docker compose -f pwd.yml -f docker-compose.go-override.yml up -d
services:
  go-erpnext:
    build:
      # Adjust this path relative to your frappe_docker directory.
      # e.g. if erpnext repo is at ../erpnext:
      context: ../erpnext/go-erpnext
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - GO_ERPNEXT_PORT=8001
    restart: unless-stopped
    networks:
      - default
