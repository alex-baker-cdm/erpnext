# Go ERPNext routing configuration
# Include this in your Nginx server block to route specific API methods to Go
#
# Usage: include /etc/nginx/conf.d/go-routes.conf;
#
# Currently: zero routes going to Go (just the health check)
# As Go implementations are added, add upstream blocks here

upstream go-erpnext {
    server go-erpnext:8001;
}

# Health check / ping
location = /api/method/go_erpnext.ping {
    proxy_pass http://go-erpnext;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

