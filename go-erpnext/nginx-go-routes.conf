# Go ERPNext routing configuration
# Include this in your Nginx server block to route specific API methods to Go
#
# Usage: include /etc/nginx/conf.d/go-routes.conf;
#
# Feature flag: set GO_STOCK_ENDPOINTS=1 in your environment to enable
# routing stock query endpoints to the Go service. When disabled (default),
# all requests continue to the Python/Frappe backend.

upstream go-erpnext {
    server go-erpnext:8001;
}

# Health check / ping (always enabled)
location = /api/method/go_erpnext.ping {
    proxy_pass http://go-erpnext;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Wave 1: Stock query endpoints (guarded by GO_STOCK_ENDPOINTS env var)
# Set GO_STOCK_ENDPOINTS=1 in the nginx environment to activate these routes.
# When the variable is unset or empty, requests fall through to Python.

# E1: get_stock_balance
location = /api/method/erpnext.stock.utils.get_stock_balance {
    set $go_stock "$GO_STOCK_ENDPOINTS";
    if ($go_stock != "1") {
        break;
    }
    proxy_pass http://go-erpnext;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

